[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
semcode-core = { path = "crates/semcode-core" }
semcode-lang = { path = "crates/semcode-lang" }
semcode-ssr = { path = "crates/semcode-ssr" }
semcode-edit = { path = "crates/semcode-edit" }
semcode-render = { path = "crates/semcode-render" }

anyhow = "1.0.104"
thiserror = "2.0.21"
blake3 = "1.8.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ignore = "0.4.33"
globset = "0.4.20"
rayon = "1.12.0"
regex = "1.13.1"
similar = "3.2.0"
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "io-std"] }
rmcp = { version = "3.5.1", features = ["server", "transport-io"] }
schemars = "1.2.3"
tempfile = "3.27.0"
tree-sitter = "=0.27.1"
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
streaming-iterator = "0.1.9"
